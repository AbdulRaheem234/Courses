<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Loading Images</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        background: #111;
        color: #fff;
      }
      h1 {
        text-align: center;
        padding: 20px;
      }
      .spacer {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
      }
      img {
        display: block;
        width: 90%;
        max-width: 700px;
        height: 400px;
        object-fit: cover;
        margin: 40px auto;
        border-radius: 12px;
        filter: blur(8px);
        transition: 0.5s;
      }
      img.loaded {
        filter: blur(0);
      }
    </style>
  </head>
  <body>
    <h1>Lazy Loading with Intersection Observer</h1>

    <div class="spacer">⬇ Scroll Down</div>

    <img data-src="https://picsum.photos/id/1015/700/400" alt="" />
    <img data-src="https://picsum.photos/id/1025/700/400" alt="" />
    <img data-src="https://picsum.photos/id/1035/700/400" alt="" />
    <img data-src="https://picsum.photos/id/1045/700/400" alt="" />

    <script>
      const images = document.querySelectorAll("img");

      const observer = new IntersectionObserver((entries, obs) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            const img = entry.target;
            img.src = img.dataset.src;
            img.onload = () => img.classList.add("loaded");
            obs.unobserve(img);
          }
        });
      });

      images.forEach((img) => observer.observe(img));
    </script>
  </body>
</html>
