<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms and Form Validation</title>
    <style>
      small {
        color: rgb(255, 0, 0);
        font-size: 12px;
      }
      #hide {
        display: none;
      }
    </style>
    <link
      rel="shortcut icon"
      href="./assets/icons8-javascript-16.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <form>
      <input
        pattern="[a-z]{3,8}"
        required
        minlength="3"
        maxlength="10"
        id="name"
        type="text"
        placeholder="name"
      />
      <div id="hide">
        <br />
        <small hidden>your name should be greater than 2 character</small>
      </div>
      <br /><br />
      <input type="email" placeholder="email" />
      <br /><br />
      <input type="password" placeholder="password" />
      <br /><br />
      <select>
        <option value="male">male</option>
        <option value="female">female</option>
        <option value="others">others</option>
      </select>
      <br /><br />
      <textarea placeholder="Tell us about you..."></textarea>
      <br /><br />
      <input type="submit" />
    </form>
    <script src="./script-11.js"></script>
  </body>
</html>
