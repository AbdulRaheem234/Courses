<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Module · IIFE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(145deg, #e8edf5 0%, #d5dde8 100%);
      padding: 1rem;
    }

    .box {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      padding: 2rem 1.8rem 1.8rem;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.25), 0 6px 12px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .box:hover {
      transform: scale(1.01);
    }

    h2 {
      text-align: center;
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      color: #0b2a3e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .balance {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 700;
      color: #0f6b3a;
      background: #e6f3ec;
      padding: 0.6rem 0.2rem;
      margin: 18px 0 20px;
      border-radius: 60px;
      letter-spacing: 1px;
      box-shadow: inset 0 2px 6px rgba(0, 40, 20, 0.08);
      transition: background 0.2s;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 2px solid #d9e1ec;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 500;
      background: #fbfdff;
      transition: 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #2b7a62;
      background: white;
      box-shadow: 0 0 0 4px rgba(43, 122, 98, 0.15);
    }

    input::placeholder {
      color: #8f9eb0;
      font-weight: 400;
      opacity: 0.7;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 13px 10px;
      border: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.96);
    }

    .check {
      background: #1d5b8e;
      box-shadow: 0 6px 0 #0f3a5a;
    }
    .check:hover {
      background: #1f6aa3;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0f3a5a;
    }

    .deposit {
      background: #1f8b4c;
      box-shadow: 0 6px 0 #136336;
    }
    .deposit:hover {
      background: #28a35c;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #136336;
    }

    .withdraw {
      background: #b13e3e;
      box-shadow: 0 6px 0 #7d2a2a;
    }
    .withdraw:hover {
      background: #cf4848;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #7d2a2a;
    }

    #msg {
      margin-top: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      min-height: 2.2rem;
      padding: 6px 10px;
      border-radius: 40px;
      background: #f2f6fc;
      color: #1a2b3c;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid rgba(0, 0, 0, 0.02);
    }

    .msg-success {
      background: #e2f3e6;
      color: #0b512b;
    }
    .msg-error {
      background: #ffe6e6;
      color: #a12b2b;
    }
    .msg-info {
      background: #e3edf9;
      color: #154a7a;
    }

    .icon {
      font-size: 1.2rem;
      line-height: 1;
    }

    /* small extra */
    .balance-currency {
      font-size: 1.8rem;
      font-weight: 400;
      color: #3f6b55;
      margin-right: 4px;
    }

    @media (max-width: 400px) {
      .box {
        padding: 1.5rem 1.2rem;
      }
      .balance {
        font-size: 2.4rem;
      }
    }
  </style>
</head>
<body>

<div class="box">
  <h2>
    <span>🏦</span> My Bank
  </h2>

  <div class="balance" id="bal">
    <span class="balance-currency">₹</span>35000
  </div>

  <input type="number" id="amt" placeholder="Enter amount (₹)" step="1" min="1">

  <div class="actions">
    <button class="check" onclick="Bank.check()">
      <span class="icon">📊</span> Check Balance
    </button>
    <button class="deposit" onclick="Bank.add(getValue())">
      <span class="icon">➕</span> Deposit
    </button>
    <button class="withdraw" onclick="Bank.draw(getValue())">
      <span class="icon">➖</span> Withdraw
    </button>
  </div>

  <p id="msg">✨ Welcome</p>
</div>

<script>
  // DOM refs
  const balanceEl = document.getElementById('bal');
  const messageEl = document.getElementById('msg');

  // ----- IIFE Bank module (encapsulated) -----
  const Bank = (function () {
    // private state
    let bankBalance = 35000;

    // private helper: update UI balance
    function updateBalanceDisplay() {
      balanceEl.innerHTML = `<span class="balance-currency">₹</span>${bankBalance}`;
    }

    // private helper: set message with style
    function setMessage(text, type = 'info') {
      messageEl.textContent = text;
      // reset classes
      messageEl.classList.remove('msg-success', 'msg-error', 'msg-info');
      if (type === 'success') messageEl.classList.add('msg-success');
      else if (type === 'error') messageEl.classList.add('msg-error');
      else messageEl.classList.add('msg-info');
    }

    // public API
    return {

      check() {
        updateBalanceDisplay();
        setMessage(`Current balance: ₹${bankBalance}`, 'info');
      },

      add(val) {
        // validate: positive number, not NaN, finite
        if (typeof val !== 'number' || isNaN(val) || !isFinite(val) || val <= 0) {
          setMessage('⚠️ Please enter a valid positive amount.', 'error');
          return;
        }

        bankBalance += val;
        updateBalanceDisplay();
        setMessage(`✅ ₹${val} deposited successfully.`, 'success');
      },

      draw(val) {
        if (typeof val !== 'number' || isNaN(val) || !isFinite(val) || val <= 0) {
          setMessage('⚠️ Enter a valid positive amount.', 'error');
          return;
        }

        if (val > bankBalance) {
          setMessage(`❌ Insufficient balance! (₹${bankBalance} available)`, 'error');
          return;
        }

        bankBalance -= val;
        updateBalanceDisplay();
        setMessage(`💸 ₹${val} withdrawn.`, 'success');
      }
    };
  })();

  // ----- helper: read input value -----
  function getValue() {
    const raw = document.getElementById('amt').value;
    const num = Number(raw);
    // if empty or invalid -> NaN, but we handle inside Bank methods
    return num;
  }

  // ----- initialise: show current balance on load -----
  Bank.check();

  // (optional) clear message on input focus – better UX
  document.getElementById('amt').addEventListener('focus', function () {
    messageEl.classList.remove('msg-success', 'msg-error', 'msg-info');
    messageEl.textContent = '✏️ Enter amount';
  });

  // (optional) reset placeholder style on blur if empty
  document.getElementById('amt').addEventListener('blur', function () {
    if (this.value === '') {
      messageEl.classList.remove('msg-success', 'msg-error', 'msg-info');
      messageEl.textContent = '✨ Ready';
    }
  });
</script>

</body>
</html>
