<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bank Module · IIFE</title>
    <link rel="stylesheet" href="./CSS/style-2.css" />
    <link
      rel="shortcut icon"
      href="./assets/icons8-javascript-16.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="box">
      <h2><span>🏦</span> My Bank</h2>

      <div class="balance" id="bal">
        <span class="balance-currency">₹</span>35000
      </div>

      <input
        type="number"
        id="amt"
        placeholder="Enter amount (₹)"
        step="1"
        min="1"
      />

      <div class="actions">
        <button class="check" onclick="Bank.check()">
          <span class="icon">📊</span> Check Balance
        </button>
        <button class="deposit" onclick="Bank.add(getValue())">
          <span class="icon">➕</span> Deposit
        </button>
        <button class="withdraw" onclick="Bank.draw(getValue())">
          <span class="icon">➖</span> Withdraw
        </button>
      </div>

      <p id="msg">✨ Welcome</p>
    </div>

    <script src="./JS/p-2.js"></script>
  </body>
</html>
